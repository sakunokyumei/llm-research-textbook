<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="t d" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">
<title id="t">エージェントのフローチャート</title>
<desc id="d">開始、質問をmessagesに入れる、LLMに次の発言を生成させる、道具の呼び出しがあるかの判断。あれば道具を実行して結果をmessagesに追加し、回数の上限に達していなければLLMに戻る。なければ答えを表示して終了。</desc>
<style>.t{font-size:15px;fill:#1f2429}.s{font-size:13px;fill:#59626b}.a{stroke:#59626b;stroke-width:2;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59626b"/></marker></defs>
<rect width="520" height="560" rx="18" fill="#fbf8f2"/>
<rect x="190" y="20" width="140" height="40" rx="20" fill="#fff" stroke="#59626b" stroke-width="2"/><text x="260" y="45" text-anchor="middle" class="t">開始</text>
<path d="M260 60V84" class="a"/>
<path d="M150 86h220l-20 44H130z" fill="#e8f0fb" stroke="#1d5bb8" stroke-width="2"/><text x="250" y="113" text-anchor="middle" class="t">質問を messages に入れる</text>
<path d="M260 130V154" class="a"/>
<rect x="140" y="156" width="240" height="46" rx="8" fill="#fbeadf" stroke="#b9501a" stroke-width="2"/><text x="260" y="184" text-anchor="middle" class="t">LLMに次の発言を生成させる</text>
<path d="M260 202V226" class="a"/>
<path d="M260 228L380 278L260 328L140 278z" fill="#fff" stroke="#59626b" stroke-width="2"/><text x="260" y="274" text-anchor="middle" class="t">道具の呼び出し</text><text x="260" y="294" text-anchor="middle" class="t">がある？</text>
<path d="M380 278H452V328" class="a"/><text x="398" y="270" class="s">ある</text>
<rect x="392" y="330" width="120" height="66" rx="8" fill="#e4f3e9" stroke="#276e47" stroke-width="2"/><text x="452" y="356" text-anchor="middle" class="t">道具を実行し</text><text x="452" y="378" text-anchor="middle" class="t">結果を追加</text>
<path d="M452 396V430H262" class="a"/>
<path d="M260 432L330 466L260 500L190 466z" fill="#fff" stroke="#59626b" stroke-width="2"/><text x="260" y="463" text-anchor="middle" class="s">上限の</text><text x="260" y="479" text-anchor="middle" class="s">回数？</text>
<path d="M330 466H500V179H382" class="a"/><text x="340" y="458" class="s">まだ</text>
<path d="M140 278H60V512" class="a"/><text x="96" y="270" class="s">ない</text>
<path d="M190 466H62" class="s" stroke="#59626b" stroke-width="2" fill="none"/><text x="120" y="458" class="s">達した</text>
<rect x="10" y="514" width="110" height="36" rx="18" fill="#fff" stroke="#59626b" stroke-width="2"/><text x="65" y="537" text-anchor="middle" class="t">答えて終了</text>
</svg>
